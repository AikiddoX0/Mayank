<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState.

      // Automatically determine path segments to keep based on whether we are on a github.io subpath or custom domain.
      var isGitHubPagesSubpath = window.location.hostname.indexOf('github.io') !== -1 && window.location.pathname.split('/').filter(Boolean).length > 0;
      var pathSegmentsToKeep = isGitHubPagesSubpath ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px; color: #D7E2EA; background-color: #0C0C0C; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;">
      <h2>Redirecting to Mayank's Portfolio...</h2>
      <p style="opacity: 0.6;">If you are not redirected automatically, <a href="/" style="color: #6C5CE7;">click here</a>.</p>
    </div>
  </body>
</html>
